name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alppy
          POSTGRES_PASSWORD: alppy
          POSTGRES_DB: alppy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alppy" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      ALPPY_ENV: ci
      ALPPY_DATABASE_URL: postgresql+psycopg://alppy:alppy@localhost:5432/alppy_test
      ALPPY_REDIS_URL: redis://localhost:6379/0
      ALPPY_SECRET_KEY: ci-secret-not-a-real-key
      # test_schema_constraints.py and test_migration_0021.py need a real
      # Postgres and skip without one. They were finding this server anyway, by
      # falling through to a hardcoded `alppy:alppy@localhost:5432` guess — so
      # renaming the service user above would have retired 34 tests silently,
      # with the run still green. Naming the server here makes the dependency
      # declared; ALPPY_REQUIRE_PG_TESTS turns the skip into a collection error
      # so CI can never again report success on tests it did not run.
      ALPPY_TEST_DATABASE_URL: postgresql+psycopg://alppy:alppy@localhost:5432/postgres
      ALPPY_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system libraries for OpenCV and PyMuPDF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Ruff
        run: ruff check apps/api
      - name: mypy
        # The config lives in apps/api/pyproject.toml and mypy only reads the
        # working directory, so the bare `mypy apps/api/alppy` from the repo
        # root silently ran with DEFAULT settings — `strict = true` was not in
        # force here for the whole life of the project.
        run: mypy --config-file apps/api/pyproject.toml apps/api/alppy
      # The print -> rasterise -> detect round trip is the only test that puts
      # the real renderer and the real detector in the same sentence, and it
      # needs a browser. Without this it skips, and a geometry drift between
      # layout.py, print.css and the detector would ship green.
      - name: Install Chromium for the print/scan round trip
        run: python -m playwright install --with-deps chromium
      # `pytest-cov` has been a declared dev dependency since the start and was
      # never once invoked, so nobody could say which modules were covered and
      # which were not — `worker/tasks.py` sat at 18% for months without that
      # being a fact anyone could have known. The floor is deliberately below
      # today's number: it is a ratchet against a large regression, not a target
      # to be gamed by writing assertion-free tests.
      - name: Tests
        run: |
          PYTHONPATH=apps/api pytest apps/api/tests -q \
            --cov=alppy --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml --cov-fail-under=85
      # One number over the whole package hides its own distribution: the audit
      # measured worker/tasks.py at 69%, db/tenancy.py at 77% and
      # api/v1/adaptive.py at 77%, each well under the average and each
      # invisible behind a green 85 (T19). tenancy.py is the only writer of the
      # RLS GUC, so a gap there is a gap in the tenant boundary itself.
      - name: Per-module coverage floors
        run: python scripts/check-coverage-floors.py coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: coverage.xml
          retention-days: 7

  vulnerabilities:
    name: Dependencies with known problems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      # gitleaks looks for secrets WE committed. Nothing looked for a
      # vulnerability in something we installed, which is the other half and the
      # half nobody notices (T17). The product holds children's names; "nobody
      # has looked" is not an answer a school should accept.
      - name: Install
        run: |
          pip install pip-audit
          pip install -e "apps/api[dev]"
      # `pip-audit` resolves the installed environment rather than the manifest,
      # so it sees transitive pins too — which is where these actually live.
      - name: pip-audit
        run: pip-audit --strict --progress-spinner off
      - run: pnpm install --frozen-lockfile
      # `--audit-level high` rather than everything: a gate nobody can keep
      # green gets disabled, and the low-severity advisory noise in a frontend
      # dependency tree is what does that. High and critical are the ones worth
      # stopping a merge for.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan — full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not the working tree: a shallow clone would
          # report a clean history because it cannot see one.
          fetch-depth: 0
      # The released binary rather than gitleaks-action: the action requires a
      # paid licence key for a private organisation repository, and a secret
      # scan that silently stops running the day the repo goes private is worse
      # than none — it reports success either way.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
      - name: Scan every commit
        run: gitleaks git --redact --verbose

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `test` was in the root package.json from the start, but no workspace
      # package defined the script — so `turbo run test` matched nothing and
      # exited 0. The JS half of the repo had no unit runner at all: every
      # non-visual design and safety rule rested on review plus a grep, and
      # `pnpm test` reported success for all of it.
      - run: pnpm turbo run lint typecheck build test

  design-rules:
    name: Design rules — no colour literals, tokens complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # DESIGN.md §10.4. tokens.css declares every colour once; print.css
      # overwrites those tokens for the black-and-white page. Everything else
      # must read var(--c-*).
      - name: Stylelint — no colour literals in CSS
        run: pnpm exec stylelint "packages/ui/src/**/*.css" "apps/web/**/*.css"

      # Stylelint does not see TSX, and an inline style is the easiest way to
      # smuggle a hex in. This is the second half of the same rule.
      #
      # `mock/fixtures.ts` is excluded for the reason print.css is: it holds a
      # stand-in for the API's own print document — a standalone page in an
      # iframe, with white paper and black fiducials and no access to the app's
      # stylesheet. It is paper, and paper is where the tokens are overwritten
      # rather than read (DESIGN.md §10.4). Narrow on purpose: one file, named.
      - name: No colour literals in TypeScript
        run: |
          if grep -rEn "#[0-9a-fA-F]{3,8}\b|rgba?\(|hsla?\(" \
               packages/ui/src apps/web/src apps/web/app \
               --include="*.ts" --include="*.tsx" \
               --exclude="fixtures.ts" 2>/dev/null; then
            echo "::error::colour literal found outside tokens.css — use var(--c-*)"
            exit 1
          fi
          echo "no colour literals in TypeScript"

      # A token defined only inside a dark block is empty for every user on the
      # default setting, and an empty var() fails silently.
      - name: Theme tokens are complete
        run: node packages/ui/scripts/check-tokens.mjs

  i18n:
    name: i18n — three locales in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/check-i18n.mjs

  # docs/plan.md §5 is the screen inventory of record, and it had gone stale at
  # eleven screens of twenty-four. Two frontend audits in a row asked whether it
  # was still the record; this is what makes the answer stay yes. Unlike §4's
  # route list it is not generated — each line says what a screen is FOR — so
  # this checks the set of paths, which is the half that drifts silently.
  screens:
    name: Screens — the inventory matches the route tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/check-screens.mjs

  layout-contract:
    name: Print geometry has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The print CSS, the PDF renderer and the scan detector all read the same
      # millimetres. The generated TypeScript must match the Python source of
      # truth, or the browser preview and the detector disagree about where a
      # bubble is.
      - name: Regenerate and diff
        run: |
          PYTHONPATH=apps/api python scripts/export-layout.py
          if ! git diff --exit-code -- packages/shared/src/layout.generated.ts; then
            echo "::error::layout.generated.ts is stale — run scripts/export-layout.py and commit"
            exit 1
          fi

  print-fonts:
    name: The printed sheet still carries its own type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API image has no node_modules: `packages/ui/src/design/fonts.css` is
      # what ships, so an upgraded font package that nobody regenerated would
      # leave the PDF and the preview typeset in a stale face — and the answer
      # boxes were measured against the current one.
      - name: Regenerate and diff
        run: |
          node scripts/embed-fonts.mjs
          if ! git diff --exit-code -- packages/ui/src/design/fonts.css; then
            echo "::error::fonts.css is stale — run scripts/embed-fonts.mjs and commit"
            exit 1
          fi

  api-contract:
    name: The client's types match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # `create_app()` is a factory with no side effects, so the document can
      # be produced from a checkout with nothing running — but it does import
      # the whole app, so the app's dependencies have to be here.
      - name: Install system libraries for OpenCV and PyMuPDF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      # `apps/api/alppy/schemas/__init__.py` is the only place a wire shape is
      # declared. The web app used to hand-mirror it in 1 162 lines, which
      # compiled on both sides whatever either one said: four models had
      # drifted to a different NAME, and nothing could have said whether the
      # shapes under them had drifted too. Same arrangement as the print
      # geometry above — regenerate, and let `git diff` be the check.
      - name: Regenerate and diff
        run: |
          PYTHONPATH=apps/api python scripts/generate-api-types.py
          if ! git diff --exit-code -- packages/shared/src/api-types.generated.ts packages/shared/src/api-routes.generated.ts; then
            echo "::error::the generated contract is stale — run scripts/generate-api-types.py and commit"
            exit 1
          fi

  schema-drift:
    name: Migrations reproduce the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alppy
          POSTGRES_PASSWORD: alppy
          POSTGRES_DB: alppy_drift
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e "apps/api[dev]"
      # Unit tests build the schema with create_all() from the models, which is
      # the very thing the migrations are meant to reproduce — so they cannot
      # see the two disagreeing. Five index drifts accumulated across 0003-0005
      # exactly this way (see migration 0008); the damage was not a slow query,
      # it was that --autogenerate proposed the same five forever and real
      # changes arrived buried in noise.
      - name: Diff a freshly migrated database against the models
        env:
          # Not ALPPY_DATABASE_URL. Both scripts open by dropping the public
          # schema, and reading the application's own variable is what made
          # that a data-loss risk for anyone who exported this repository's
          # .env and ran the documented command. The dedicated variable, the
          # `_drift` database name and ALPPY_ENV are the three things
          # alppy.db.disposable insists on before it will hand over a DSN.
          ALPPY_ENV: ci
          ALPPY_DISPOSABLE_DATABASE_URL: postgresql+psycopg://alppy:alppy@localhost:5432/alppy_drift
        run: python scripts/check-schema-drift.py

  row-level-security:
    name: The database holds the tenant boundary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alppy
          POSTGRES_PASSWORD: alppy
          POSTGRES_DB: alppy_rls
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e "apps/api[dev]"
      # Its own job for the same reason schema-drift has one, and it is the
      # same blind spot: the unit suite runs on SQLite, which has no roles, no
      # set_config and no row-level security. It cannot notice a policy that
      # was never created, a FORCE that was left off — which exempts the owner,
      # so alembic and the CLI keep working and it looks fine — or a
      # DSN pointed back at the owning role, which switches the whole
      # mechanism off with every test still green (D84).
      - name: Prove a bound tenant cannot read past its school
        env:
          # Not ALPPY_DATABASE_URL. Both scripts open by dropping the public
          # schema, and reading the application's own variable is what made
          # that a data-loss risk for anyone who exported this repository's
          # .env and ran the documented command. The dedicated variable, the
          # `_rls` database name and ALPPY_ENV are the three things
          # alppy.db.disposable insists on before it will hand over a DSN.
          ALPPY_ENV: ci
          ALPPY_DISPOSABLE_DATABASE_URL: postgresql+psycopg://alppy:alppy@localhost:5432/alppy_rls
        run: python scripts/check-rls.py

  # Neither image had ever been built by a gating job (D25). The only build was
  # `live.yml`, which runs nightly and does not gate anything — so a Dockerfile
  # broken on Monday was discovered on Tuesday morning at the earliest, and a
  # Dockerfile broken by a dependency change was discovered by whoever next
  # tried to deploy. Both images are built here and pushed nowhere: the claim is
  # only "this builds", which is the claim that was missing.
  images:
    name: Both container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Cached through the Actions cache rather than a registry: there is no
      # registry yet (D4), and a build that takes eleven minutes every time is a
      # job someone moves off the critical path within a month.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # `pip-audit` and `pnpm audit` read the manifests WE wrote. Neither has ever
  # looked at the operating system underneath (D32), which is where a base image
  # pinned by digest quietly accumulates CVEs between Dependabot bumps — and the
  # API image is the fat one: Debian, OpenCV's system libraries, and a whole
  # Chromium.
  #
  # HIGH and CRITICAL only, and `exit-code: 1` only on those. A scanner that
  # fails a merge on a medium advisory in a transitive Debian package is a
  # scanner somebody disables, and a disabled scanner reports success forever.
  image-vulnerabilities:
    name: Base images without known problems
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: alppy-api:scan
          cache-from: type=gha,scope=api
      - name: Build the web image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: alppy-web:scan
          cache-from: type=gha,scope=web
      - name: Scan the API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alppy-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Scan the web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alppy-web:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # `pyproject.toml` is all `>=` ranges; `requirements.lock` is what the image
  # actually installs, with hashes (D18). A dependency added to one and not the
  # other means the image and the test run are two different environments — and
  # the test run is the one that would still be green.
  lockfile:
    name: The Python lockfile matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.13" }
      # `--check` resolves and fails rather than rewriting, which is the whole
      # point: a lockfile CI is willing to regenerate is a lockfile that never
      # disagrees with anything.
      - name: uv.lock is current
        run: uv lock --check --python 3.12
        working-directory: apps/api
      - name: requirements.lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements.txt -o requirements.lock
          if ! git diff --exit-code -- requirements.lock; then
            echo "::error::requirements.lock is stale — run \`make lock\` and commit"
            exit 1
          fi
        working-directory: apps/api

  e2e:
    name: E2E and theme screenshots
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @alppy/web exec playwright install --with-deps chromium
      # Behaviour runs everywhere: no horizontal scroll at 390px, touch-target
      # floor, theme persistence across a reload, contrast composing with dark,
      # calm hiding decoration, no untranslated key reaching the page.
      - name: Run Playwright (behaviour)
        run: pnpm --filter @alppy/web exec playwright test --grep-invert "renders in"

      # The 42 screenshot tests are NOT run here, and that is the honest shape
      # rather than an omission (T13).
      #
      # Playwright files baselines per platform. All 42 committed baselines are
      # `-darwin`; there are no `-linux` ones. On this runner the comparison
      # therefore had nothing to compare against, and the step carried
      # `continue-on-error: true` so it could not fail the build either. What
      # it could do was report 42 passing tests into the run summary — the
      # worst of the three outcomes, because a number that large reads as
      # coverage. It was 42 tests occupying the slot of 42 tests.
      #
      # Two honest options: commit Linux baselines, or do not claim to check.
      # Until someone generates the baselines on Linux — `playwright test
      # --grep "renders in" --update-snapshots` on an ubuntu container, then
      # commit the `-linux` files — this is the second. `pnpm test:e2e` still
      # runs them locally on macOS, where the baselines are real.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
