# One command brings up the whole product with demo data:
#
#     docker compose up
#
# No API key is required. The AI layer ships deterministic offline providers
# (alppy/ai/providers.py) precisely so a reviewer on a clean machine can run the
# full loop without an account anywhere.

name: alppy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alppy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alppy}
      POSTGRES_DB: ${POSTGRES_DB:-alppy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alppy} -d ${POSTGRES_DB:-alppy}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ALPPY_S3_ACCESS_KEY:-alppy}
      MINIO_ROOT_PASSWORD: ${ALPPY_S3_SECRET_KEY:-alppy-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket, then exits 0. Everything that writes objects
  # waits on it completing successfully.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # init-bucket.sh authenticates as the MinIO root user; the app then uses
      # the same credentials, so these must match the `minio` service above.
      MINIO_ROOT_USER: ${ALPPY_S3_ACCESS_KEY:-alppy}
      MINIO_ROOT_PASSWORD: ${ALPPY_S3_SECRET_KEY:-alppy-secret}
      ALPPY_S3_ENDPOINT_URL: http://minio:9000
      ALPPY_S3_BUCKET: ${ALPPY_S3_BUCKET:-alppy}
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    volumes:
      - ./infra/minio/init-bucket.sh:/init-bucket.sh:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      ALPPY_ENV: ${ALPPY_ENV:-local}
      ALPPY_DEBUG: ${ALPPY_DEBUG:-true}
      ALPPY_SECRET_KEY: ${ALPPY_SECRET_KEY:-dev-only-change-me}
      # Demo mode: a request with no session cookie answers as the demo
      # teacher, so the app can be clicked through without an account. FALSE
      # unless you set it — it is the only bypass of the session cookie, and
      # that cookie is what keeps a roster of children's real names off an open
      # URL (docs/privacy.md).
      ALPPY_DEMO_MODE: ${ALPPY_DEMO_MODE:-false}
      ALPPY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alppy}:${POSTGRES_PASSWORD:-alppy}@postgres:5432/${POSTGRES_DB:-alppy}
      ALPPY_REDIS_URL: redis://redis:6379/0
      ALPPY_S3_ENDPOINT_URL: http://minio:9000
      # The API reaches MinIO on the compose network; the teacher's browser
      # reaches it on the host. Download URLs are signed against the former and
      # rewritten to the latter — without this every PDF link pointed at a
      # hostname only the containers can resolve.
      ALPPY_S3_PUBLIC_ENDPOINT_URL: ${ALPPY_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      ALPPY_S3_BUCKET: ${ALPPY_S3_BUCKET:-alppy}
      ALPPY_S3_ACCESS_KEY: ${ALPPY_S3_ACCESS_KEY:-alppy}
      ALPPY_S3_SECRET_KEY: ${ALPPY_S3_SECRET_KEY:-alppy-secret}
      # Offline by default — `docker compose up` must work on a clean machine
      # with no account anywhere. Set ALPPY_AI_CHAT_PROVIDER to openai or
      # anthropic and supply THAT provider's key; nothing else changes. Holding
      # the other one's key is not enough: the app logs `ai.provider.no_key` and
      # falls back to echo rather than failing, so read the log if a run comes
      # back suspiciously fast and suspiciously generic.
      ALPPY_AI_CHAT_PROVIDER: ${ALPPY_AI_CHAT_PROVIDER:-echo}
      # Empty means "that provider's default model". A model id belonging to a
      # different provider is refused at startup rather than 404-ing every call.
      ALPPY_AI_CHAT_MODEL: ${ALPPY_AI_CHAT_MODEL:-}
      ALPPY_ANTHROPIC_API_KEY: ${ALPPY_ANTHROPIC_API_KEY:-}
      ALPPY_OPENAI_API_KEY: ${ALPPY_OPENAI_API_KEY:-}
      # The prompt log holds what was actually sent. Off unless a school asks
      # for it, and swept by `python -m alppy.cli purge-prompt-logs`.
      ALPPY_AI_PROMPT_LOG_ENABLED: ${ALPPY_AI_PROMPT_LOG_ENABLED:-false}
      ALPPY_AI_EMBEDDINGS_PROVIDER: ${ALPPY_AI_EMBEDDINGS_PROVIDER:-hash}
      ALPPY_CORS_ORIGINS: '["http://localhost:3000"]'
      # The sheet renderer inlines packages/ui/src/design/{tokens,base,print}.css
      # at render time so the PDF cannot drift from the design system. The image
      # copies them to /app/design-css (apps/api/Dockerfile), but nothing told
      # the app where — so the preview and every PDF render raised
      # DesignSystemNotFoundError inside the container.
      ALPPY_DESIGN_CSS_DIR: /app/design-css
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Migrate, seed, then serve. Idempotent: re-running never duplicates data.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["serve"]
    volumes:
      - ./infra/api/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["worker"]
    volumes:
      - ./infra/api/entrypoint.sh:/entrypoint.sh:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle; see apps/web/Dockerfile.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NODE_ENV: production
      # The browser talks to the API directly, so this is the host-visible URL.
      # The name must match what the client reads (lib/api/client.ts): it was
      # NEXT_PUBLIC_API_URL here and NEXT_PUBLIC_API_BASE_URL there, so every
      # request fell back to a same-origin /api/v1 that the web container does
      # not serve, and nothing past the login form worked.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
