[project]
name = "alppy-api"
version = "0.1.0"
description = "Alppy API — Swiss edtech for teachers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.2.0",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "anthropic>=0.40.0",
  "pypdf>=5.1.0",
  "pdfplumber>=0.11.4",
  "numpy>=2.1.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=11.0.0",
  "pymupdf>=1.24.0",
  "structlog>=24.4.0",
  "jinja2>=3.1.4",
  "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
  "types-boto3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alppy*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
