[project]
name = "alppy-api"
version = "0.1.0"
description = "Alppy API — Swiss edtech for teachers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  # [email] pulls email-validator, which EmailStr imports lazily at schema
  # build time — without it the app raises ImportError on startup, but only in
  # an environment where nothing else happened to install it.
  "pydantic[email]>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.2.0",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "anthropic>=0.40.0",
  "openai>=1.60.0",
  "pypdf>=5.1.0",
  "pdfplumber>=0.11.4",
  "numpy>=2.1.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=11.0.0",
  # iOS photographs in HEIC by default, and photographing the pile of copies is
  # an explicit workflow (docs/plan.md §9). Neither OpenCV nor Pillow reads it
  # unaided, so this is the decode path that lets the allowlist accept it —
  # accepting the content type without one only moves the failure later.
  "pillow-heif>=0.21.0",
  "pymupdf>=1.24.0",
  "structlog>=24.4.0",
  "jinja2>=3.1.4",
  "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  # Shuffles the order of every run and prints the seed (T20). Order
  # independence was previously unverified rather than known-good: 71 files,
  # module-scoped fixtures, module-level constants and a session-wide
  # environment, with nothing shuffling any of it. Verified over three seeds
  # when this was added, all green — which is a fact worth having rather than
  # an assumption. A failure here reproduces with `-p randomly
  # --randomly-seed=<seed>` from the run's own header.
  "pytest-randomly>=3.15.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
  "types-boto3",
  # Rasterises a rendered PDF so the scan detector can be run against the real
  # printed page, not a synthetic one — see tests/test_print_scan_roundtrip.py.
  "pymupdf>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alppy*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends() in a default is the documented idiom
  "E501",    # line length is the formatter's job; flagging prose and long
             # URLs in comments is noise, and `ruff format` keeps code in line
  "RUF001",  # Exercise statements, curriculum wording and comments are French
  "RUF002",  # and German. The "ambiguous unicode" rules guard against homoglyph
  "RUF003",  # attacks in identifiers, not accented prose in a Swiss product.
  "UP047",   # PEP 695 generics need 3.12+. The project targets 3.12, but the
             # explicit TypeVar form also runs on 3.11, which keeps the test
             # suite runnable for contributors who have not upgraded yet.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# `from alppy.sheets import layout as L` — L is the geometry namespace, and it
# reads better than repeating `layout.` on every coordinate.
"alppy/scan/*.py" = ["N812", "N811"]
"alppy/sheets/*.py" = ["N812", "N811"]
"alppy/services/scan_processing.py" = ["N812"]
"tests/*.py" = ["N812", "N811", "N802"]
# `from ...postgresql import UUID as PgUUID` — disambiguating it from the stdlib
# uuid.UUID is the point of the alias.
"alppy/models/__init__.py" = ["N811"]
"alppy/db/base.py" = ["N811"]

# OpenCV's stubs return loosely-parameterised ndarrays: cv2.warpPerspective is
# typed as returning `ndarray[Any, dtype[integer | floating]]` whatever you feed
# it, so every call into cv2 trips return-value/arg-type against our precise
# `NDArray[np.uint8]` annotations. Those annotations are worth keeping — they
# document what the detector actually requires — so the friction is scoped to
# the two modules that talk to cv2 rather than silenced with per-line ignores
# or given up on by widening the signatures to Any.
[[tool.mypy.overrides]]
module = ["alppy.scan.detector", "alppy.scan.synthetic"]
disable_error_code = ["return-value", "arg-type", "assignment", "no-any-return", "call-overload", "union-attr"]
